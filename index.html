<!doctype html>
<html lang="pl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa i maszyna czasu</title>
<style>
:root{color-scheme:dark;--bg:#0d171d;--panel:#14242c;--line:#34505a;--ink:#f5f1e7;--muted:#b1c6c8;--mint:#b7f27c;--orange:#ffd295}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#214139 0,transparent 52%),var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif;min-height:100dvh}main{max-width:960px;margin:auto;padding:26px clamp(16px,4vw,40px) 38px}header, .bar,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{padding-bottom:18px;border-bottom:1px solid var(--line)}.tag,.eyebrow{font:700 12px/1.4 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}.pill{border:1px solid var(--line);border-radius:100px;padding:5px 12px;color:var(--muted);font-size:13px}.hero{padding:48px 0 26px}h1,h2,p{margin:0}h1{font-size:clamp(38px,8vw,82px);line-height:.99;letter-spacing:-.07em;margin:12px 0 17px}h2{font-size:clamp(23px,5vw,36px);line-height:1.15;letter-spacing:-.035em;margin:8px 0}p{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,30px)}.card{display:flex;flex-direction:column;align-items:flex-start}.card p{flex:1}.art{height:94px;width:100%;background:#1c333b;border-radius:13px;margin-bottom:20px;display:grid;place-items:center;overflow:hidden}.art svg{height:78px;width:100%}.card button{margin-top:20px}button{font:inherit;font-weight:680;cursor:pointer;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:#223942;padding:10px 15px;min-height:46px;touch-action:manipulation}button:hover:not(:disabled){border-color:var(--mint)}button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:3px}button:disabled{cursor:default}.primary{background:var(--mint);color:#142516;border-color:transparent}.ghost{background:transparent}.bar{margin:18px 0}.progress{height:5px;background:#2a4148;border-radius:8px;overflow:hidden;margin:0 0 15px}.progress span{display:block;height:100%;background:var(--mint)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:15px}.choices.four{grid-template-columns:repeat(4,1fr)}.timeline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.time{padding:11px;border:1px solid var(--line);border-radius:12px;background:#1b3038;font-size:14px}.year{display:block;color:var(--orange);font:700 22px ui-monospace,monospace}.map{display:block;width:100%;max-height:325px;margin:12px auto 0;background:#10282f;border-radius:14px}.map text{font:700 14px system-ui;pointer-events:none}.map .pin{cursor:pointer;outline:none}.map .pin:focus-visible circle,.map .pin:hover circle{stroke:white;stroke-width:3}.feedback{margin-top:14px;padding:12px 14px;background:#1b3038;border-left:4px solid var(--mint);border-radius:7px}.feedback.bad{border-color:var(--orange)}.feedback p{color:var(--ink)}.bonus{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:15px}.bonus strong{color:var(--orange);margin-right:6px}.next{margin-top:13px}.ok{background:#304b31;border-color:var(--mint)}.wrong{border-color:var(--orange);background:#533c32}footer{border-top:1px solid var(--line);margin-top:26px;padding-top:13px;color:var(--muted);font-size:13px}a{color:var(--mint)}.review{padding-left:23px}.review li{margin:9px 0}.big{font-size:52px;color:var(--mint);font-weight:800}.subtle{font-size:13px;color:var(--muted)}@media(max-width:620px){.hero{padding-top:28px}.cards{grid-template-columns:1fr}.art{height:65px}.art svg{height:62px}.choices:not(.four){grid-template-columns:1fr}.card button{width:100%}}
.topic-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}.topic-list button{text-align:left;display:grid;grid-template-columns:30px 1fr;align-items:baseline;column-gap:6px}.topic-list span{color:var(--mint);font:700 14px ui-monospace,monospace}.topic-list small{grid-column:2;color:var(--muted)}.choices.quiz{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:620px){.topic-list,.choices.quiz{grid-template-columns:1fr}}
.exp-sequence{padding-left:28px;color:var(--muted)}.exp-sequence li{padding:5px 2px}.exp-sequence strong{color:var(--ink)}.topic-list button:disabled{opacity:.58}
.study-map{width:min(100%,520px);display:block;margin:12px 0}.study-task{border-top:1px solid var(--line);padding-top:12px;margin-top:18px}.study-task h3{font-size:.9rem;margin:0 0 6px;color:var(--muted)}.study-task textarea{display:block;width:100%;font:inherit;color:inherit;background:#203136;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}.study-task blockquote{border-left:3px solid var(--line);padding-left:10px;margin:8px 0}.study-answer{white-space:pre-wrap;overflow-wrap:anywhere}.study-check{display:flex;align-items:baseline;gap:8px;margin-top:8px}.study-check input{accent-color:#b7f27c}
</style>
<main><header><span class="tag">Atlas misji</span><span class="pill">Klasa 7 · Polska</span></header><div id="screen"></div><footer>Tematy według <a href="https://www.nowaera.pl/szkola-podstawowa/podreczniki-szkolne/geografia">Planeta Nowa 7</a> i <a href="https://sklep.nowaera.pl/product/wczoraj-i-dzis-klasa-7-podrecznik-do-historii-dla-szkoly-podstawowej-062062">Wczoraj i dziś 7</a>.</footer></main>
<script src="./game.js" defer></script>
<script src="./expedition.js" defer></script>
<script src="./history-study.js" defer></script>
</html>
