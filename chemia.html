const screen = document.querySelector('#screen');
const modes = [...document.querySelectorAll('[data-mode]')];
let selected = 0;
let state;

function card(element) {
  const {symbol, name, caption, fact, hint, url, credit, source} = element;
  return `<article class="element-card">
    <div>
      <h3><span class="symbol">${symbol}</span> — ${name}</h3>
      <p>${fact}</p>
      <p class="hint"><strong>Jak zapamiętać?</strong> ${hint}</p>
    </div>
    <figure>
      <img src="${url}" alt="${caption}" loading="lazy">
      <figcaption>${caption}<small><a href="${source}" target="_blank" rel="noopener">Źródło zdjęcia</a> · ${credit}</small></figcaption>
    </figure>
  </article>`;
}

function watchImages() {
  for (const image of screen.querySelectorAll('img')) {
    function showFallback() {
      const fallback = document.createElement('p');
      fallback.textContent = 'Zdjęcie można otworzyć przez link w podpisie.';
      image.replaceWith(fallback);
    }
    if (image.complete && !image.naturalWidth) showFallback();
    else image.addEventListener('error', showFallback, {once:true});
  }
}

function learn(focusCard = false) {
  screen.innerHTML = `<h2>Odkryj pierwiastek</h2>
    <p>Wybierz symbol, żeby zobaczyć zdjęcie i ciekawostkę.</p>
    <div class="grid">${elements.map(({symbol, name}, index) =>
      `<button type="button" aria-label="${symbol} — ${name}" aria-pressed="${index === selected}" data-index="${index}">${symbol}</button>`).join('')}</div>
    ${card(elements[selected])}`;
  screen.querySelectorAll('[data-index]').forEach(button => {
    button.onclick = () => { selected = Number(button.dataset.index); learn(true); };
  });
  if (focusCard) screen.querySelector('[aria-pressed=true]').focus();
  watchImages();
}

function shuffled(items) {
  const result = [...items];
  for (let index = result.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [result[index], result[other]] = [result[other], result[index]];
  }
  return result;
}

function normalizeName(name) {
  return name.toLocaleLowerCase('pl').normalize('NFD').replace(/\p{M}/gu, '').replaceAll('ł', 'l');
}

function startRound(mode, questions, focus = false) {
  const pool = shuffled(elements).slice(0, mode === 'test' ? 10 : elements.length);
  state = {mode, queue: questions ?? pool.map((element, index) => ({
    element, askSymbol: index % 2 === 0
  })), answers:[], position:0, streak:0, code:[]};
  question(focus);
}

function question(focus) {
  const current = state.queue[state.position];
  if (!current) return results(focus);
  const training = state.mode === 'train';
  const {element, askSymbol} = current;
  const answer = askSymbol ? element.symbol : element.name;
  screen.innerHTML = `
    <p>${training ? 'Złam szyfr · ' + state.streak + '/3 poprawne z rzędu' : 'Kartkówka · ' + (state.position + 1) + '/' + state.queue.length}</p>
    <h2 class="prompt">${askSymbol ? element.name : element.symbol}</h2>
    <form>
      <label for="answer">${askSymbol ? 'Wpisz symbol' : 'Wpisz polską nazwę'}</label>
      <div class="row"><input class="answer" id="answer" required autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32">
      <button class="primary">${training ? 'Sprawdź' : 'Zapisz odpowiedź'}</button></div>
    </form>
    <div id="feedback" aria-live="polite"></div>`;

  const form = screen.querySelector('form');
  const input = screen.querySelector('input');
  if (focus) input.focus();
  form.onsubmit = event => {
    event.preventDefault();
    if (input.readOnly) return;
    const typed = input.value.trim();
    if (!typed) { input.value = ''; input.reportValidity(); input.focus(); return; }
    const correct = askSymbol ? typed === answer : normalizeName(typed) === normalizeName(answer);
    state.answers.push({current, correct, typed, answer});
    state.position++;
    if (!training) return question(true);

    let code = '';
    if (correct) {
      state.streak++;
      state.code.push(element.symbol);
      if (state.streak === 3) {
        code = 'Kod odblokowany · ' + state.code.join(' · ');
        state.streak = 0;
        state.code = [];
      }
    } else {
      state.streak = 0;
      state.code = [];
      if (!state.queue.slice(state.position).includes(current)) state.queue.push(current);
    }

    input.readOnly = true;
    form.querySelector('button').disabled = true;
    const feedback = screen.querySelector('#feedback');
    const caseError = askSymbol && typed.toLowerCase() === answer.toLowerCase();
    feedback.innerHTML = `<div class="feedback ${correct ? '' : 'wrong'}"><strong>${correct ? 'Dobrze!' : caseError ? 'Sprawdź wielkość liter.' : 'Spróbuj zapamiętać tę parę.'}</strong>
      <p>Poprawna odpowiedź · ${answer}</p>
      ${code ? '<p class="symbol">' + code + '</p>' : ''}</div>
      ${card(element)}
      <button type="button" class="primary">${state.position < state.queue.length ? 'Dalej →' : 'Zobacz wynik →'}</button>`;
    const next = feedback.querySelector('button');
    next.onclick = () => question(true);
    watchImages();
  };
}

function results(focus) {
  const correct = state.answers.filter(item => item.correct).length;
  const mistakes = state.answers.filter(item => !item.correct);
  const retry = [...new Set(mistakes.map(item => item.current))];
  const mode = state.mode;
  screen.innerHTML = `<h2 tabindex="-1">Wynik · ${correct}/${state.answers.length}</h2>
    ${mode === 'test' ? state.answers.map(({current, correct, typed, answer}, index) =>
      `<details ${correct ? '' : 'open'}><summary>${index + 1}. ${current.askSymbol ? current.element.name : current.element.symbol} · ${correct ? 'dobrze' : 'do powtórki'}</summary>
        <p>Twoja odpowiedź · <span data-typed="${index}"></span></p>
        <p>Poprawna odpowiedź · ${answer}</p>${card(current.element)}</details>`).join('') : ''}
    <div class="row">${retry.length ? '<button type="button" class="primary" id="retry">Powtórz tylko błędy</button>' : ''}
    <button type="button" id="again">${mode === 'test' ? 'Nowa kartkówka' : 'Zagraj jeszcze raz'}</button></div>`;
  screen.querySelectorAll('[data-typed]').forEach(span => {
    span.textContent = state.answers[Number(span.dataset.typed)].typed;
  });
  const retryButton = screen.querySelector('#retry');
  if (retryButton) retryButton.onclick = () => startRound(mode, retry, true);
  screen.querySelector('#again').onclick = () => startRound(mode, undefined, true);
  if (focus) screen.querySelector('h2').focus();
  watchImages();
}

function selectMode(mode, focus = false) {
  modes.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
  if (mode === 'learn') learn();
  else startRound(mode, undefined, focus);
}

modes.forEach(button => button.onclick = () => selectMode(button.dataset.mode, true));
selectMode('learn');
</script>
</body>
