<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff2f6">
<title>Portal Niki · Kraina obłoków</title>
<style>
:root{color-scheme:light;--ink:#421046;--paper:#fff6ed;--pink:#ff268f;--white:#fffdf8;--shadow:#eb429a}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#fff3e9;font:1rem/1.5 "Nunito",ui-rounded,system-ui,sans-serif}
main{width:min(1440px,100%);margin-inline:auto}
 .hero{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;overflow:hidden;isolation:isolate;aspect-ratio:2.68;background:linear-gradient(125deg,#ff1989,#ff349a);padding:0 3%}
.hero:after{content:"";position:absolute;inset:auto 0 0;height:36%;z-index:0;background:
 radial-gradient(ellipse 10% 56% at 4% 100%,#fff3e9 99%,transparent),
 radial-gradient(ellipse 15% 61% at 18% 117%,#fff3e9 99%,transparent),
 radial-gradient(ellipse 14% 65% at 36% 123%,#fff3e9 99%,transparent),
 radial-gradient(ellipse 13% 65% at 55% 120%,#fff3e9 99%,transparent),
 radial-gradient(ellipse 20% 65% at 78% 124%,#fff3e9 99%,transparent),
 radial-gradient(ellipse 12% 59% at 96% 104%,#fff3e9 99%,transparent),
 radial-gradient(ellipse 12% 80% at 1% 100%,#ffa5d3 99%,transparent),
 radial-gradient(ellipse 14% 63% at 59% 108%,#ffa5d3 99%,transparent),
 radial-gradient(ellipse 16% 68% at 100% 105%,#ffa5d3 99%,transparent)}
.hero>div{z-index:2;padding:10% 0 0 8%}
.brand{position:absolute;top:5%;left:2%;background:#fff7fa;border:clamp(2px,.4vw,5px) solid white;border-radius:999px;padding:0 .45em;line-height:1.15;font-weight:950;font-size:clamp(.83rem,2.75vw,2.45rem);letter-spacing:-.06em;box-shadow:0 4px 0 #bf1371}
.brand span{color:#46ad9d}
.hero h1{font-family:"Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#fff9fb;font-size:clamp(2.4rem,11.6vw,10.45rem);font-weight:1000;line-height:.8;letter-spacing:-.077em;-webkit-text-stroke:clamp(4px,1.24vw,15px) var(--ink);paint-order:stroke fill;text-shadow:0 .055em var(--ink)}
.hero h1 span{display:block;margin-top:.13em}
.mascot{position:absolute;right:2%;bottom:-1%;z-index:1;width:43%;height:101%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 3px 0 #cc218b)}
.heart{position:absolute;left:52%;top:5%;font:1000 clamp(1.4rem,6.5vw,5.4rem)/1 system-ui;color:white;transform:rotate(-22deg);text-shadow:0 .055em #b9136f}
h1,h2,h3,p{margin:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.25vw,18px);padding:0 clamp(8px,1.2vw,16px) 18px}
.card{display:flex;flex-direction:column;align-items:center;border:clamp(2px,.55vw,6px) solid var(--ink);border-radius:clamp(15px,3vw,34px);padding:clamp(9px,2vw,28px);box-shadow:0 6px 0 #f02a93,inset 0 3px 0 #fff9;background:linear-gradient(155deg,#ff9fd8,#ffc4e6)}
.card.english{background:linear-gradient(155deg,#ffd9c2,#ffc9bf)}
h2{font-family:"Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;font-size:clamp(1.35rem,4.3vw,4rem);font-weight:1000;line-height:1.05;letter-spacing:-.065em;text-align:center}
.sticker{display:block;width:87%;height:clamp(78px,17vw,225px);object-fit:contain;margin-block:clamp(5px,1vw,14px)}
.action,button{border:2px solid var(--ink);border-radius:14px;background:var(--white);color:var(--ink);font:inherit;font-weight:850;text-decoration:none;padding:9px 12px;min-height:46px;cursor:pointer}
.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;width:100%;border-radius:999px;font-size:clamp(.86rem,2.4vw,1.5rem);text-align:center}
.action:hover,button:hover{background:#fff0ff}
:focus-visible{outline:3px solid #145f55;outline-offset:4px}
dialog{width:min(92vw,530px);border:3px solid var(--ink);border-radius:24px;background:var(--paper);color:var(--ink);padding:clamp(16px,4vw,30px);box-shadow:0 7px 0 #df6fb1}
dialog::backdrop{background:#35103e99}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-top button{padding:5px 10px}
#word{font-size:clamp(1.45rem,5vw,2.4rem);font-weight:950;margin:10px 0}.choices{display:grid;gap:8px}.choices button{text-align:left}.choices button[disabled]{cursor:default}.choices button.correct{background:#bdeddb}.choices button.wrong{background:#f8ced9}#feedback{min-height:2em;margin-top:8px}#next{margin-top:4px}
@media(max-width:420px){.action{padding:6px;font-size:.78rem;gap:4px}.card{padding:8px}.sticker{width:96%}}

:root{--ink:#493362;--paper:#fff8fc;--white:#fffdfd;--shadow:#e8d6f6}
body{background:linear-gradient(140deg,#fff4fa,#f7f0ff 84%);min-height:100vh}
main{width:min(1120px,100%);padding:clamp(12px,3vw,32px)}
.hero{aspect-ratio:auto;min-height:clamp(235px,42vw,460px);padding:clamp(16px,4vw,44px);border:1px solid #f3d8ed;border-radius:32px;background:radial-gradient(ellipse at 75% 20%,#fff2f9,transparent 44%),linear-gradient(135deg,#ffe0ef,#ece0fc)}
.hero:after{height:47%;background:radial-gradient(ellipse 36% 63% at 8% 110%,#fff9 99%,transparent),radial-gradient(ellipse 31% 75% at 63% 130%,#fff9 99%,transparent),radial-gradient(ellipse 25% 68% at 106% 110%,#fffc 99%,transparent)}
.hero:before{content:"✦";position:absolute;left:54%;top:16%;color:#b67b37;font-size:clamp(18px,4vw,44px);transform:rotate(12deg)}
.hero>div{padding:0;z-index:2}
.brand{position:static;display:inline-flex;gap:.4em;width:max-content;max-width:100%;padding:.34em .68em;font-size:clamp(.83rem,2vw,1.35rem);border:1px solid #fff;background:#fff8;box-shadow:none;letter-spacing:0}
.brand span{color:#9e69be}
.hero h1{color:#54386f;font-size:clamp(2.3rem,7.5vw,6rem);font-weight:850;line-height:.94;letter-spacing:-.06em;text-shadow:none;-webkit-text-stroke:0;margin-top:.32em}
.mascot{right:3%;bottom:5%;width:43%;height:90%;filter:saturate(.44) hue-rotate(-9deg) drop-shadow(0 12px 18px #ac6eb64a)}
.heart{left:auto;right:8%;top:12%;color:#b67b37;font-size:clamp(1rem,4vw,2.8rem);text-shadow:none}
.cards{padding:0;gap:clamp(10px,2vw,24px);margin-top:clamp(12px,2.4vw,26px)}
.card,.card.english{border:1px solid #eadcf1;border-radius:24px;box-shadow:0 8px 22px #754a9212;background:#fffafd}
.card.english{background:#fbf8ff}
h2{font-size:clamp(1.25rem,3.5vw,2.65rem);font-weight:850;letter-spacing:-.035em}
.sticker{filter:saturate(.58)}
.action,button{border:1px solid #e0c8ee;background:#f5e8fc;color:#543572}
.action:hover,button:hover{background:#ead7f8}
dialog{border:1px solid #eadcf1;box-shadow:0 12px 40px #4b2b6640}
@media(max-width:420px){.hero{border-radius:24px}.card,.card.english{border-radius:18px}.hero h1{font-size:clamp(2rem,10vw,2.7rem)}}

:root{--ink:#554357;--paper:#fffbfa;--white:#fffdfd}
body{background:radial-gradient(ellipse at 70% 0,#fdf0fa,transparent 75%),#fffbfa}
main{width:min(960px,100%);padding:clamp(14px,4vw,40px)}
.hero{min-height:clamp(245px,42vw,440px);padding:clamp(18px,5vw,50px);border:1px solid #f4e5ef;border-radius:32px;background:radial-gradient(ellipse at 69% 68%,#f0e7f7,transparent 67%),linear-gradient(130deg,#fff9f5,#fbe8ef)}
.hero:before,.hero:after{content:none}
.brand{padding:0;background:none;border:0;color:#765769;font-weight:650}
.hero h1{color:#644b65;font-family:Georgia,serif;font-size:clamp(2.45rem,8vw,5.5rem);font-weight:400;letter-spacing:-.065em;line-height:.92}
.mascot{right:0;bottom:3%;width:58%;height:95%;filter:none;object-position:center}
.cards{margin-top:clamp(12px,3vw,24px)}
.card,.card.english{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:12px;row-gap:12px;border:1px solid #eee2e9;box-shadow:0 8px 24px #79516e0a;background:#fffdfd;padding:clamp(12px,2.7vw,25px)}
.subject-icon{color:#886b9b;border-radius:50%;background:#f8edf3;display:grid;place-items:center;width:2.2em;height:2.2em;font-size:clamp(.95rem,3vw,1.55rem)}
.card.english .subject-icon{background:#f1ebf9}
h2{font:400 clamp(1.16rem,4vw,2rem)/1.1 Georgia,serif;text-align:left;letter-spacing:-.025em}
.action{grid-column:1/-1;margin-top:0;background:#f9edf3;color:#614967;border:1px solid #efe2eb;font-size:clamp(.82rem,2.25vw,1rem);font-weight:700}
.english .action{background:#f2edf8}
.action:hover{background:#eee0f3}
@media(max-width:390px){.card,.card.english{column-gap:6px;padding:9px}.hero{min-height:218px}.mascot{width:55%}}

dialog{background:#fffafb;border:1px solid #eadde8;border-radius:27px;box-shadow:0 18px 56px #79516e33;padding:clamp(18px,5vw,34px)}
dialog::backdrop{background:#39274269}.dialog-top{padding-bottom:12px;border-bottom:1px solid #eee2e9}
#counter{color:#765769;font-size:.9rem;margin-top:12px}#word{font-family:Georgia,serif;font-weight:400;color:#644b65}
.choices button,#next,.dialog-top button{background:#f5edf9;border:1px solid #eaddf0;color:#614967}.choices button:hover:not(:disabled){background:#ebdff2}
.choices button.correct{background:#e1efe7;border-color:#bdd9ca;color:#305447}.choices button.wrong{background:#faedf0;border-color:#edcdd7;color:#79394d}
#next{background:#755482;color:white}
:focus-visible{outline-color:#936799}
</style>
</head>

<div class="cards">
  <section class="card" aria-labelledby="reading-title">
    <div class="subject-icon" aria-hidden="true">📖</div><h2 id="reading-title">Czytanie</h2>
    <a class="action" href="../bullerbyn/index.html">Dzieci z Bullerbyn</a>
  </section>
  <section class="card english" aria-labelledby="english-title">
    <div class="subject-icon" aria-hidden="true">☁</div><h2 id="english-title">Angielski</h2>
    <button class="action" type="button" id="open">Zagraj w słówka</button>
  </section>
</div>
<dialog id="game" aria-labelledby="game-title">
  <div class="dialog-top"><h2 id="game-title">Zagraj w słówka</h2><form method="dialog"><button type="submit" aria-label="Zamknij grę">✕</button></form></div>
  <p id="counter"></p>
  <p id="word" tabindex="-1"></p>
  <div id="choices" class="choices"></div>
  <p id="feedback" role="status"></p>
  <button type="button" id="next" hidden>Dalej</button>
</dialog>
</main>
<script>
'use strict';
const words=[['book','książka'],['horse','koń'],['garden','ogród'],['cloud','chmura'],['friend','przyjaciel']];
const el=id=>document.getElementById(id);
const game=el('game');
let index=0;
function nextWord(){
  const [word,answer]=words[index];
  el('counter').textContent='Słówko '+(index+1)+' z '+words.length;
  el('word').textContent='Co znaczy „'+word+'”?';
  el('feedback').textContent='';
  el('choices').replaceChildren();
  el('next').hidden=true;
  const options=[0,1,3].map(offset=>words[(index+offset)%words.length][1]);
  for(let i=options.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [options[i],options[j]]=[options[j],options[i]];
  }
  for(const option of options){
    const button=document.createElement('button');
    button.type='button';
    button.textContent=option;
    button.addEventListener('click',()=>{
      if(option!==answer){
        button.classList.add('wrong');
        button.disabled=true;
        el('feedback').textContent='Spróbuj jeszcze raz.';
        el('choices').querySelector('button:not(:disabled)').focus();
        return;
      }
      button.classList.add('correct');
      for(const choice of el('choices').children) choice.disabled=true;
      el('feedback').textContent='Brawo!';
      el('next').textContent=index===words.length-1?'Zobacz wynik':'Dalej';
      el('next').hidden=false;
      el('next').focus();
    });
    el('choices').append(button);
  }
  el('word').focus();
}
el('open').addEventListener('click',()=>{
  index=0;
  game.showModal();
  nextWord();
});
el('next').addEventListener('click',()=>{
  if(++index<words.length) nextWord();
  else {
    el('counter').textContent='';
    el('word').textContent='Wszystkie 5 słówek rozwiązane!';
    el('choices').replaceChildren();
    el('feedback').textContent='';
    el('next').hidden=true;
    el('word').focus();
  }
});
</script>
