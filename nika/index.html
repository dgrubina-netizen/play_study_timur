<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff258f">
<title>Portal Niki</title>
<style>
:root{color-scheme:light;--ink:#421046;--paper:#fff6ed;--pink:#ff268f;--white:#fffdf8;--shadow:#eb429a}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:1rem/1.5 "Nunito",ui-rounded,system-ui,sans-serif}
main{width:min(1060px,100%);margin:auto;padding:clamp(12px,3vw,32px)}
.hero{position:relative;overflow:hidden;min-height:300px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:clamp(18px,5vw,48px);border:3px solid var(--ink);border-radius:28px;background:var(--pink);box-shadow:0 7px 0 var(--ink);isolation:isolate}
.hero:after{content:"";position:absolute;inset:auto -15% -96px;height:145px;border-radius:50%;background:#ffacd7;z-index:-1}
.brand{display:inline-block;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:950;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.brand span{color:#268674}
h1,h2,h3,p{margin:0}
h1{margin-top:20px;color:var(--white);font-size:clamp(3rem,9vw,7.2rem);line-height:.88;font-weight:1000;letter-spacing:-.075em;-webkit-text-stroke:clamp(2px,.55vw,6px) var(--ink);paint-order:stroke fill;text-shadow:0 5px var(--ink)}
h1 span{display:block}
.mascot{display:block;width:100%;height:auto;max-width:430px;justify-self:center;align-self:end}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.5vw,23px);margin-top:24px}
.card{display:flex;flex-direction:column;align-items:flex-start;border:3px solid var(--ink);border-radius:22px;padding:clamp(14px,3vw,25px);box-shadow:0 6px 0 var(--shadow);background:#ffc3e8}
.card.english{background:#ffe0cb;--shadow:#e67d53}
h2{font-size:clamp(1.6rem,4vw,2.45rem);font-weight:950;line-height:1.05;letter-spacing:-.045em}
.sticker{display:block;width:100%;height:clamp(85px,15vw,158px);object-fit:contain;margin-block:9px}
.action,button{border:2px solid var(--ink);border-radius:14px;background:var(--white);color:var(--ink);font:inherit;font-weight:850;text-decoration:none;padding:9px 12px;min-height:46px;cursor:pointer}
.action{display:inline-flex;align-items:center;gap:8px;margin-top:auto;width:100%}
.action:hover,button:hover{background:#fff0ff}
:focus-visible{outline:3px solid #145f55;outline-offset:4px}
dialog{width:min(92vw,530px);border:3px solid var(--ink);border-radius:24px;background:var(--paper);color:var(--ink);padding:clamp(16px,4vw,30px);box-shadow:0 7px 0 #df6fb1}
dialog::backdrop{background:#35103e99}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-top button{padding:5px 10px}
#word{font-size:clamp(1.45rem,5vw,2.4rem);font-weight:950;margin:10px 0}.choices{display:grid;gap:8px}.choices button{text-align:left}.choices button[disabled]{cursor:default}.choices button.correct{background:#bdeddb}.choices button.wrong{background:#f8ced9}#feedback{min-height:2em;margin-top:8px}#next{margin-top:4px}
@media(max-width:520px){.hero{min-height:195px;padding:19px 13px}.brand{padding-inline:8px;font-size:.8rem}h1{font-size:clamp(2.75rem,10vw,4rem)}.card{padding:11px}.action{padding:6px 8px;font-size:.84rem}.mascot{align-self:center}}
</style>
</head>

<script>
'use strict';
const words=[['book','książka'],['horse','koń'],['garden','ogród'],['cloud','chmura'],['friend','przyjaciel']];
const el=id=>document.getElementById(id);
const game=el('game');
let index=0;
function nextWord(){
  const [word,answer]=words[index];
  el('counter').textContent='Słówko '+(index+1)+' z '+words.length;
  el('word').textContent='Co znaczy „'+word+'”?';
  el('feedback').textContent='';
  el('choices').replaceChildren();
  el('next').hidden=true;
  const options=[0,1,3].map(offset=>words[(index+offset)%words.length][1]);
  for(let i=options.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [options[i],options[j]]=[options[j],options[i]];
  }
  for(const option of options){
    const button=document.createElement('button');
    button.type='button';
    button.textContent=option;
    button.addEventListener('click',()=>{
      if(option!==answer){
        button.classList.add('wrong');
        button.disabled=true;
        el('feedback').textContent='Spróbuj jeszcze raz.';
        el('choices').querySelector('button:not(:disabled)').focus();
        return;
      }
      button.classList.add('correct');
      for(const choice of el('choices').children) choice.disabled=true;
      el('feedback').textContent='Brawo!';
      el('next').textContent=index===words.length-1?'Zobacz wynik':'Dalej';
      el('next').hidden=false;
      el('next').focus();
    });
    el('choices').append(button);
  }
  el('word').focus();
}
el('open').addEventListener('click',()=>{
  index=0;
  game.showModal();
  nextWord();
});
el('next').addEventListener('click',()=>{
  if(++index<words.length) nextWord();
  else {
    el('counter').textContent='';
    el('word').textContent='Wszystkie 5 słówek rozwiązane!';
    el('choices').replaceChildren();
    el('feedback').textContent='';
    el('next').hidden=true;
    el('word').focus();
  }
});
</script>
</body>
</html>
