  "Na zakręcie kierowcy jechali wolniej i łatwiej mogli zauważyć stoisko.",
  "Jak Lasse podzielił zarobione pieniądze?",
  "Po równo między dzieci."
 ],
 [
  "Dwie opiekunki",
  "Kim Lisa i Anna miały się opiekować?",
  "Kerstin, młodszą siostrą Ollego.",
  "Co Kerstin zrobiła, gdy dziewczynki przestały ją zatrzymywać w wózku?",
  "Między innymi weszła do rowu z wodą.",
  "Jaka przygoda z pastą do butów sprawiła, że dziewczynki zwątpiły w swoje umiejętności?",
  "Kerstin umazała się czarną pastą i bardzo krzyczała, gdy próbowały ją umyć."
 ],
 [
  "Wyprawa na raki",
  "Z kim dzieci wyruszyły łowić raki?",
  "Z ojcami.",
  "Jak spędziły wieczór nad jeziorem?",
  "Siedziały przy ognisku i słuchały opowieści.",
  "Co dzieci znalazły w koszach rano?",
  "Dużo raków."
 ]
]</script>
<script>
'use strict';
const el = id => document.getElementById(id);
const chapters = JSON.parse(el('chapter-data').textContent);
const starts = [0,17,32,44];
const key = 'bullerbyn-reading-quest-v1';
let selected = 0;
let done = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(key));
  if (saved && Number.isInteger(saved.selected) && chapters[saved.selected]) selected = saved.selected;
  if (Array.isArray(saved?.done)) done = new Set(saved.done.filter(i => Number.isInteger(i) && chapters[i]));
} catch {}

function save() {
  try { localStorage.setItem(key,JSON.stringify({selected,done:[...done]})); } catch {}
}

function renderProgress() {
  el('tally').textContent = 'Omówione rozdziały: ' + done.size + ' / ' + chapters.length;
  el('progress').value = done.size;
  el('mark').textContent = done.has(selected) ? 'Cofnij oznaczenie' : 'Zaznacz jako omówiony';
  for (const button of el('map').children) {
    const index = Number(button.dataset.index);
    button.classList.toggle('done',done.has(index));
    button.textContent = (done.has(index) ? '✓ ' : '') + (index + 1);
    button.setAttribute('aria-label','Rozdział ' + (index + 1) + (done.has(index) ? ', omówiony' : ''));
  }
}

function render(focus=false) {
  const part = selected < starts[1] ? 0 : selected < starts[2] ? 1 : 2;
  el('part').value = String(part);
  el('map').replaceChildren();
  for (let i=starts[part];i<starts[part+1];i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.index = i;
    if (i===selected) button.setAttribute('aria-current','step');
    button.addEventListener('click',()=>openChapter(i));
    el('map').append(button);
  }
  const chapter = chapters[selected];
  el('title').textContent = chapter[0];
  el('label').textContent = 'Rozdział ' + (selected+1) + ' z ' + chapters.length;
  el('questions').replaceChildren();
  for (let i=1;i<chapter.length;i+=2) {
    const item = document.createElement('li');
    const prompt = document.createElement('strong');
    prompt.textContent = chapter[i];
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'Odpowiedź dla dorosłego';
    const answer = document.createElement('p');
    answer.textContent = chapter[i+1];
    details.append(summary,answer);
    item.append(prompt,details);
    el('questions').append(item);
  }
  el('prev').disabled = selected===0;
  el('next').disabled = selected===chapters.length-1;
  el('status').textContent = '';
  renderProgress();
  if (focus) el('title').focus();
}

function openChapter(index) {
  if (!chapters[index]) return;
  selected = index;
  save();
  render(true);
}

el('part').addEventListener('change',event=>openChapter(starts[Number(event.target.value)]));
el('prev').addEventListener('click',()=>openChapter(selected-1));
el('next').addEventListener('click',()=>openChapter(selected+1));
el('mark').addEventListener('click',()=>{
  if (done.has(selected)) {
    done.delete(selected);
    el('status').textContent = 'Cofnięto oznaczenie rozdziału.';
  } else {
    done.add(selected);
    el('status').textContent = done.size===chapters.length ? 'Meta! Cała książka omówiona.' : 'Rozdział omówiony.';
  }
  save();
  renderProgress();
});
render();
</script>
</body>
</html>
