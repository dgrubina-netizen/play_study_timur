 ],

 ],

  "Miały w milczeniu przejść przez płoty i położyć zioła pod poduszką, żeby przyśnił im się przyszły mąż.",
  "Jak skończyła się wróżba Lisy?",

  "Wyciągnęły kosze pełne raków. Lisa wracała zmęczona, ale szczęśliwa."

]</script>
<script>
'use strict';
const el = id => document.getElementById(id);
const chapters = JSON.parse(el('chapter-data').textContent);
const recallQuestions = JSON.parse(el('recall-data').textContent);
const pages = [7,10,14,21,25,31,38,43,49,58,63,70,74,80,86,90,96,103,105,115,120,127,134,139,148,156,165,174,183,191,199,209,217,224,232,240,250,261,269,281,294,302,312,332];
const starts = [0,17,32,44];
const key = 'bullerbyn-reading-quest-v1';
let selected = 0;
let mode = 'recall';
let done = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(key));
  if (saved && Number.isInteger(saved.selected) && chapters[saved.selected]) selected = saved.selected;
  if (saved?.mode === 'details') mode = 'details';
  if (Array.isArray(saved?.done)) done = new Set(saved.done.filter(i => Number.isInteger(i) && chapters[i]));
} catch {}

function save() {
  try { localStorage.setItem(key,JSON.stringify({selected,done:[...done],mode})); } catch {}
}

function renderProgress() {
  el('tally').textContent = 'Omówione rozdziały: ' + done.size + ' / ' + chapters.length;
  el('progress').value = done.size;
  el('mark').textContent = done.has(selected) ? 'Cofnij oznaczenie' : 'Zaznacz jako omówiony';
  for (const button of el('map').children) {
    const index = Number(button.dataset.index);
    button.classList.toggle('done',done.has(index));
    button.textContent = (done.has(index) ? '✓ ' : '') + (index + 1);
    button.setAttribute('aria-label','Rozdział ' + (index + 1) + (done.has(index) ? ', omówiony' : ''));
  }
}

function render(focus=false) {
  const part = selected < starts[1] ? 0 : selected < starts[2] ? 1 : 2;
  el('part').value = String(part);
  el('chapter-picker').value = String(selected);
  el('map').replaceChildren();
  for (let i=starts[part];i<starts[part+1];i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.index = i;
    if (i===selected) button.setAttribute('aria-current','step');
    button.addEventListener('click',()=>openChapter(i));
    el('map').append(button);
  }
  const chapter = chapters[selected];
  el('title').textContent = chapter[0];
  el('label').textContent = 'Rozdział ' + (selected+1) + ' z ' + chapters.length + ' · str. ' + pages[selected];
  renderQuestions();
  el('prev').disabled = selected===0;
  el('next').disabled = selected===chapters.length-1;
  el('status').textContent = '';
  renderProgress();
  if (focus) el('title').focus();
}

function renderQuestions() {
  const isRecall = mode === 'recall';
  const questions = isRecall ? recallQuestions[selected] : chapters[selected].slice(1);
  el('recall').setAttribute('aria-pressed',String(isRecall));
  el('details').setAttribute('aria-pressed',String(!isRecall));
  el('mode-note').textContent = isRecall
    ? 'Opowiedz własnymi słowami o najważniejszych wydarzeniach.'
    : 'Przypomnij sobie szczegóły z przeczytanego rozdziału.';
  el('questions').replaceChildren();
  for (let i=0;i<questions.length;i+=2) {
    const item = document.createElement('li');
    const prompt = document.createElement('strong');
    prompt.textContent = questions[i];
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'Odpowiedź dla dorosłego';
    const answer = document.createElement('p');
    answer.textContent = questions[i+1];
    details.append(summary,answer);
    item.append(prompt,details);
    el('questions').append(item);
  }
}

function changeMode(nextMode) {
  if (mode === nextMode) return;
  mode = nextMode;
  save();
  renderQuestions();
}

el('recall').addEventListener('click',()=>changeMode('recall'));
el('details').addEventListener('click',()=>changeMode('details'));

function openChapter(index) {
  if (!chapters[index]) return;
  selected = index;
  save();
  render(true);
}

chapters.forEach(([title],index)=>{
  const option = document.createElement('option');
  option.value = String(index);
  option.textContent = (index+1) + '. ' + title + ' · str. ' + pages[index];
  el('chapter-picker').append(option);
});
el('chapter-picker').addEventListener('change',event=>openChapter(Number(event.target.value)));
el('part').addEventListener('change',event=>openChapter(starts[Number(event.target.value)]));
el('prev').addEventListener('click',()=>openChapter(selected-1));
el('next').addEventListener('click',()=>openChapter(selected+1));
el('mark').addEventListener('click',()=>{
  if (done.has(selected)) {
    done.delete(selected);
    el('status').textContent = 'Cofnięto oznaczenie rozdziału.';
  } else {
    done.add(selected);
    el('status').textContent = done.size===chapters.length ? 'Meta! Cała książka omówiona.' : 'Rozdział omówiony.';
  }
  save();
  renderProgress();
});
render();
</script>
</body>
</html>
